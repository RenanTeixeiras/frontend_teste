<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Diagnósticos CE Infinity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="page-title">Diagnóstico Empresarial CE Infinity</h1>
        <p class="subtitle" id="page-subtitle">
          Responda às perguntas de cada área para receber os feedbacks personalizados.
        </p>
      </header>

      <div class="form-selector">
        <span class="form-selector-label">
          Qual diagnóstico você deseja realizar?
        </span>
        <div class="form-selector-buttons">
          <button
            type="button"
            class="selector-btn active"
            data-form="diagnostico"
          >
            Diagnóstico Empresarial
          </button>
          <button type="button" class="selector-btn" data-form="viabilidade">
            Viabilidade de Novas Ideias
          </button>
        </div>
      </div>

      <form id="diagnostico-form"></form>

      <div class="actions">
        <button type="button" class="primary" id="btn-enviar">
          Enviar diagnóstico
        </button>
      </div>

      <div id="error" class="error"></div>

      <section id="resultados" class="resultados" style="display: none">
        <div class="resultados-header">
          <h2 id="resultados-title">Resultados</h2>
          <button type="button" id="btn-pdf" class="primary" style="display: none">
            Baixar PDF
          </button>
        </div>

        <div id="result-grid" class="result-grid"></div>
      </section>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
