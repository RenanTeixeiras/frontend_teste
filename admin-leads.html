<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>CE Infinity • Leads</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">CE</div>
          <div class="brand-text">
            <div class="brand-name">CE INFINITY</div>
            <div class="brand-sub">CONSULTORIA EMPRESARIAL</div>
          </div>
        </div>

        <nav class="nav">
          <a href="./admin.html" class="nav-link">Dashboard</a>
          <a href="./index.html" class="nav-link">Site</a>
        </nav>

        <span class="nav-cta">Admin</span>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div class="hero-inner">
          <div>
            <div class="section-eyebrow">ADMIN</div>
            <h1>Leads cadastrados</h1>
            <p class="hero-subtitle">Selecione um lead para ver o resultado completo.</p>
          </div>
        </div>
      </section>

      <section class="container">
        <section class="metric-section">
          <div class="admin-grid">
            <div class="metric-card">
              <h3>Diagnóstico (empresas)</h3>
              <div id="leads-diagnostico"></div>
            </div>
            <div class="metric-card">
              <h3>Viabilidade (pessoas)</h3>
              <div id="leads-viabilidade"></div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="./admin-leads.js"></script>
  </body>
</html>
